<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#070A10"
  >

  <title>Verification Code — JOYET</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            joyet: "#3B82F6",
            joyetLight: "#60A5FA",
            joyetSky: "#38BDF8",
            ink: "#070A10",
            panel: "#0E141D"
          }
        }
      }
    };
  </script>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;

      min-height: 100vh;

      font-family: "Inter", sans-serif;

      color: #F8FAFC;

      background:
        radial-gradient(
          circle at 15% 15%,
          rgba(59,130,246,.15),
          transparent 30%
        ),
        radial-gradient(
          circle at 85% 85%,
          rgba(56,189,248,.08),
          transparent 30%
        ),
        #070A10;
    }

    .glass {
      background:
        rgba(14,20,29,.82);

      backdrop-filter:
        blur(25px);

      -webkit-backdrop-filter:
        blur(25px);

      box-shadow:
        0 35px 100px rgba(0,0,0,.45),
        inset 0 1px rgba(255,255,255,.025);
    }

    .otp-grid {
      display: grid;

      grid-template-columns:
        repeat(6,1fr);

      gap: 8px;
    }

    .otp {
      width: 100%;

      height: 62px;

      border-radius: 15px;

      border:
        1px solid
        rgba(255,255,255,.055);

      background:
        rgba(255,255,255,.035);

      color: white;

      outline: none;

      text-align: center;

      font-size: 23px;

      font-weight: 800;

      caret-color: #60A5FA;

      transition: .2s ease;
    }

    .otp:focus {
      border-color:
        rgba(59,130,246,.7);

      background:
        rgba(59,130,246,.05);

      box-shadow:
        0 0 0 4px
        rgba(59,130,246,.09);
    }

    .verify-btn {
      width: 100%;

      height: 56px;

      border: 0;

      border-radius: 16px;

      background:
        linear-gradient(
          135deg,
          #3B82F6,
          #2563EB
        );

      color: white;

      font-size: 15px;

      font-weight: 700;

      cursor: pointer;

      box-shadow:
        0 18px 40px
        rgba(37,99,235,.22);

      transition: .2s ease;
    }

    .verify-btn:hover {
      transform:
        translateY(-1px);

      box-shadow:
        0 24px 50px
        rgba(37,99,235,.28);
    }

    .verify-btn:disabled {
      opacity: .6;
      cursor: not-allowed;
      transform: none;
    }

    .status {
      display: none;

      padding: 13px 15px;

      border-radius: 14px;

      margin-bottom: 18px;

      font-size: 13px;

      line-height: 1.5;
    }

    .status.show {
      display: block;
    }

    .status.error {
      color: #FCA5A5;

      background:
        rgba(239,68,68,.08);

      border:
        1px solid
        rgba(239,68,68,.12);
    }

    .status.success {
      color: #93C5FD;

      background:
        rgba(59,130,246,.08);

      border:
        1px solid
        rgba(59,130,246,.12);
    }

    .resend {
      border: 0;

      background: transparent;

      color: #60A5FA;

      font-size: 13px;

      font-weight: 600;

      cursor: pointer;
    }

    .resend:disabled {
      color: #475569;
      cursor: not-allowed;
    }

    @media(max-width:450px) {

      .otp-grid {
        gap: 6px;
      }

      .otp {
        height: 54px;
        font-size: 20px;
      }

    }

  </style>

</head>

<body>

  <main
    class="min-h-screen flex items-center justify-center px-5 py-10"
  >

    <div class="w-full max-w-md">


      <!-- LOGO -->

      <div class="text-center mb-8">

        <a
          href="index.html"
          class="text-3xl font-black tracking-[-.06em]"
        >
          JOYET
        </a>

      </div>


      <!-- CARD -->

      <div
        class="glass rounded-[30px] p-6 sm:p-9"
      >


        <!-- ICON -->

        <div
          class="w-14 h-14 rounded-2xl flex items-center justify-center mb-6"
          style="
            background:rgba(59,130,246,.10);
            color:#60A5FA;
          "
        >

          <svg
            width="25"
            height="25"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            viewBox="0 0 24 24"
          >

            <rect
              x="3"
              y="5"
              width="18"
              height="14"
              rx="3"
            />

            <path
              d="M7 12h.01M12 12h.01M17 12h.01"
              stroke-width="3"
              stroke-linecap="round"
            />

          </svg>

        </div>


        <p
          class="text-xs uppercase tracking-[.18em] text-blue-400 font-semibold mb-3"
        >
          Verification
        </p>


        <h1
          class="text-3xl font-bold tracking-tight"
        >
          Enter your code
        </h1>


        <p
          id="description"
          class="text-sm text-slate-500 mt-3 leading-6"
        >
          Enter the 6-digit verification code sent to your
          email address.
        </p>


        <div
          id="emailDisplay"
          class="text-xs text-blue-300/80 mt-3"
        ></div>


        <div
          id="status"
          class="status mt-6"
        ></div>


        <!-- OTP FORM -->

        <form
          id="otpForm"
          class="mt-7"
        >

          <div
            class="otp-grid"
            id="otpGrid"
          >

            <input
              class="otp"
              maxlength="1"
              inputmode="numeric"
              autocomplete="one-time-code"
              aria-label="Verification digit 1"
            >

            <input
              class="otp"
              maxlength="1"
              inputmode="numeric"
              aria-label="Verification digit 2"
            >

            <input
              class="otp"
              maxlength="1"
              inputmode="numeric"
              aria-label="Verification digit 3"
            >

            <input
              class="otp"
              maxlength="1"
              inputmode="numeric"
              aria-label="Verification digit 4"
            >

            <input
              class="otp"
              maxlength="1"
              inputmode="numeric"
              aria-label="Verification digit 5"
            >

            <input
              class="otp"
              maxlength="1"
              inputmode="numeric"
              aria-label="Verification digit 6"
            >

          </div>


          <button
            type="submit"
            id="verifyButton"
            class="verify-btn mt-6"
          >

            <span id="verifyText">
              Verify code
            </span>

          </button>

        </form>


        <!-- RESEND -->

        <div class="text-center mt-7">

          <p
            class="text-xs text-slate-600 mb-2"
          >
            Didn't receive the code?
          </p>


          <button
            id="resend"
            class="resend"
            disabled
          >

            Resend code in
            <span id="timer">
              60
            </span>s

          </button>

        </div>


        <div class="text-center mt-6">

          <a
            href="forgot-password.html"
            class="text-xs text-slate-500 hover:text-blue-400"
          >
            Use another email
          </a>

        </div>

      </div>


      <p
        class="text-center text-xs text-slate-600 mt-6"
      >
        Never share your verification code with anyone.
      </p>

    </div>

  </main>


  <script>

    const inputs =
      [...document.querySelectorAll(".otp")];

    const form =
      document.getElementById("otpForm");

    const status =
      document.getElementById("status");

    const verifyButton =
      document.getElementById("verifyButton");

    const verifyText =
      document.getElementById("verifyText");

    const resend =
      document.getElementById("resend");

    const timer =
      document.getElementById("timer");

    const savedEmail =
      sessionStorage.getItem(
        "joyet_reset_email"
      );


    /*
      Display the email selected on
      the previous page.
    */

    if (savedEmail) {

      document
        .getElementById("emailDisplay")
        .textContent =
          savedEmail;

    }


    function showStatus(
      message,
      type = "error"
    ) {

      status.textContent =
        message;

      status.className =
        "status show " + type;

    }


    /*
      OTP INPUT BEHAVIOR
    */

    inputs.forEach((input, index) => {

      input.addEventListener("input", () => {

        input.value =
          input.value
            .replace(/\D/g, "")
            .slice(0,1);


        if (
          input.value &&
          index < inputs.length - 1
        ) {

          inputs[index + 1].focus();

        }

      });


      input.addEventListener(
        "keydown",
        (event) => {

          if (
            event.key === "Backspace" &&
            !input.value &&
            index > 0
          ) {

            inputs[index - 1].focus();

          }

        }
      );


      input.addEventListener(
        "paste",
        (event) => {

          event.preventDefault();


          const pasted =
            event.clipboardData
              .getData("text")
              .replace(/\D/g,"")
              .slice(0,6);


          pasted
            .split("")
            .forEach((digit,i) => {

              if (inputs[i]) {

                inputs[i].value =
                  digit;

              }

            });


          if (pasted.length === 6) {

            inputs[5].focus();

          }

        }
      );

    });


    /*
      FRONTEND DEMO OTP

      For the demo, entering:

      123456

      is considered valid.

      Replace this later with your
      real OTP verification.
    */


    form.addEventListener(
      "submit",
      (event) => {

        event.preventDefault();


        const code =
          inputs
            .map(input => input.value)
            .join("");


        if (code.length !== 6) {

          showStatus(
            "Please enter all 6 digits."
          );

          return;

        }


        verifyButton.disabled = true;

        verifyText.textContent =
          "Verifying…";


        setTimeout(() => {

          if (code === "123456") {

            showStatus(
              "Verification successful. Returning to login…",
              "success"
            );


            sessionStorage.setItem(
              "joyet_reset_verified",
              "true"
            );


            setTimeout(() => {

              window.location.href =
                "login.html";

            }, 1000);

          } else {

            verifyButton.disabled =
              false;

            verifyText.textContent =
              "Verify code";

            showStatus(
              "Invalid verification code. Try again."
            );

          }

        }, 700);

      }
    );


    /*
      RESEND TIMER
    */

    let seconds = 60;

    let interval =
      setInterval(() => {

        seconds--;

        timer.textContent =
          seconds;


        if (seconds <= 0) {

          clearInterval(interval);

          resend.disabled =
            false;

          resend.textContent =
            "Resend verification code";

        }

      },1000);


    resend.addEventListener(
      "click",
      () => {

        resend.disabled =
          true;

        seconds = 60;

        resend.innerHTML =
          `Resend code in <span id="timer">60</span>s`;


        const newTimer =
          document.getElementById("timer");


        interval =
          setInterval(() => {

            seconds--;

            newTimer.textContent =
              seconds;


            if (seconds <= 0) {

              clearInterval(interval);

              resend.disabled =
                false;

              resend.textContent =
                "Resend verification code";

            }

          },1000);

      }
    );


    inputs[0].focus();

  </script>

</body>
</html>
