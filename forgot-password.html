<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#070A10"
  >

  <title>Forgot Password — JOYET</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            joyet: "#3B82F6",
            joyetLight: "#60A5FA",
            joyetSky: "#38BDF8",
            ink: "#070A10",
            panel: "#0E141D"
          }
        }
      }
    };
  </script>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family: "Inter", sans-serif;

      color: #F8FAFC;

      background:
        radial-gradient(
          circle at 15% 15%,
          rgba(59,130,246,.15),
          transparent 30%
        ),
        radial-gradient(
          circle at 85% 85%,
          rgba(56,189,248,.08),
          transparent 30%
        ),
        #070A10;
    }

    .glass {
      background:
        rgba(14,20,29,.82);

      backdrop-filter:
        blur(25px);

      -webkit-backdrop-filter:
        blur(25px);

      box-shadow:
        0 35px 100px rgba(0,0,0,.45),
        inset 0 1px rgba(255,255,255,.025);
    }

    .field-wrap {
      position: relative;
    }

    .icon {
      position: absolute;

      left: 17px;
      top: 50%;

      transform:
        translateY(-50%);

      color: #64748B;

      pointer-events: none;
    }

    .field {
      width: 100%;

      height: 56px;

      border-radius: 16px;

      border:
        1px solid
        rgba(255,255,255,.055);

      background:
        rgba(255,255,255,.035);

      color: #F8FAFC;

      outline: none;

      padding-left: 48px;

      font-size: 14px;

      transition: .2s ease;
    }

    .field::placeholder {
      color: #64748B;
    }

    .field:focus {
      background:
        rgba(59,130,246,.045);

      border-color:
        rgba(59,130,246,.65);

      box-shadow:
        0 0 0 4px
        rgba(59,130,246,.09);
    }

    .btn {
      width: 100%;

      height: 56px;

      border: 0;

      border-radius: 16px;

      color: white;

      font-size: 15px;

      font-weight: 700;

      cursor: pointer;

      background:
        linear-gradient(
          135deg,
          #3B82F6,
          #2563EB
        );

      box-shadow:
        0 18px 40px
        rgba(37,99,235,.22);

      transition: .2s ease;
    }

    .btn:hover {
      transform:
        translateY(-1px);

      box-shadow:
        0 24px 50px
        rgba(37,99,235,.28);
    }

    .btn:disabled {
      opacity: .6;
      cursor: not-allowed;
      transform: none;
    }

    .status {
      display: none;

      padding: 13px 15px;

      margin-bottom: 18px;

      border-radius: 14px;

      font-size: 13px;

      line-height: 1.5;
    }

    .status.show {
      display: block;
    }

    .status.error {
      color: #FCA5A5;

      background:
        rgba(239,68,68,.08);

      border:
        1px solid rgba(239,68,68,.12);
    }

    .status.success {
      color: #93C5FD;

      background:
        rgba(59,130,246,.08);

      border:
        1px solid rgba(59,130,246,.12);
    }

    .info-card {
      background:
        rgba(255,255,255,.025);

      border:
        1px solid
        rgba(255,255,255,.035);

      border-radius: 18px;
    }

  </style>

</head>

<body>

  <main
    class="min-h-screen flex items-center justify-center px-5 py-10"
  >

    <div class="w-full max-w-md">

      <!-- LOGO -->

      <div class="text-center mb-8">

        <a
          href="index.html"
          class="text-3xl font-black tracking-[-.06em]"
        >
          JOYET
        </a>

      </div>


      <!-- CARD -->

      <div
        class="glass rounded-[30px] p-6 sm:p-9"
      >

        <div
          class="w-14 h-14 rounded-2xl flex items-center justify-center mb-6"
          style="
            background:rgba(59,130,246,.10);
            color:#60A5FA;
          "
        >

          <svg
            width="25"
            height="25"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            viewBox="0 0 24 24"
          >

            <path
              d="M4 10V7a8 8 0 0 1 16 0v3"
            />

            <rect
              x="3"
              y="10"
              width="18"
              height="10"
              rx="3"
            />

          </svg>

        </div>


        <p
          class="text-xs uppercase tracking-[.18em] text-blue-400 font-semibold mb-3"
        >
          Account recovery
        </p>


        <h1
          class="text-3xl font-bold tracking-tight"
        >
          Forgot your password?
        </h1>


        <p
          class="text-sm text-slate-500 mt-3 leading-6"
        >
          Enter the email address connected to your JOYET
          account. We'll continue to the verification step.
        </p>


        <div
          id="status"
          class="status mt-6"
        ></div>


        <form
          id="forgotForm"
          class="mt-7 space-y-5"
        >

          <div>

            <label
              class="block text-sm text-slate-300 font-medium mb-2"
            >
              Email address
            </label>

            <div class="field-wrap">

              <div class="icon">

                <svg
                  width="19"
                  height="19"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  viewBox="0 0 24 24"
                >

                  <rect
                    x="3"
                    y="5"
                    width="18"
                    height="14"
                    rx="3"
                  />

                  <path
                    d="m4 7 8 6 8-6"
                  />

                </svg>

              </div>


              <input
                id="email"
                type="email"
                class="field"
                placeholder="you@example.com"
                autocomplete="email"
                required
              />

            </div>

          </div>


          <button
            id="sendButton"
            type="submit"
            class="btn"
          >

            <span id="sendText">
              Continue
            </span>

          </button>

        </form>


        <div
          class="info-card p-4 mt-7"
        >

          <div class="flex gap-3">

            <div
              class="w-9 h-9 shrink-0 rounded-xl flex items-center justify-center"
              style="
                background:rgba(59,130,246,.10);
                color:#60A5FA;
              "
            >

              <svg
                width="18"
                height="18"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                viewBox="0 0 24 24"
              >

                <path
                  d="M12 3 20 6v6c0 5-3.3 8-8 9-4.7-1-8-4-8-9V6l8-3Z"
                />

                <path
                  d="m9 12 2 2 4-4"
                />

              </svg>

            </div>

            <div>

              <div
                class="text-sm font-medium text-slate-300"
              >
                Keep your account secure
              </div>

              <p
                class="text-xs text-slate-600 leading-5 mt-1"
              >
                Never share verification codes with anyone.
              </p>

            </div>

          </div>

        </div>


        <div class="text-center mt-7">

          <a
            href="login.html"
            class="text-sm text-blue-400 hover:text-blue-300"
          >
            ← Back to login
          </a>

        </div>

      </div>


      <p
        class="text-center text-xs text-slate-600 mt-6"
      >
        © JOYET. All rights reserved.
      </p>

    </div>

  </main>


  <script>

    const form =
      document.getElementById("forgotForm");

    const email =
      document.getElementById("email");

    const button =
      document.getElementById("sendButton");

    const buttonText =
      document.getElementById("sendText");

    const status =
      document.getElementById("status");


    function showStatus(message, type = "error") {

      status.textContent =
        message;

      status.className =
        "status show " + type;

    }


    form.addEventListener("submit", (event) => {

      event.preventDefault();


      const value =
        email.value.trim();


      if (!value) {

        showStatus(
          "Please enter your email address."
        );

        return;

      }


      /*
        FRONTEND ONLY.

        Save email temporarily so the OTP page
        can display which account is being verified.
      */

      sessionStorage.setItem(
        "joyet_reset_email",
        value
      );


      button.disabled = true;

      buttonText.textContent =
        "Continuing…";


      setTimeout(() => {

        window.location.href =
          "otp.html";

      }, 500);

    });

  </script>

</body>
</html>
